    </circle>
    <circle r="4">
      <animateMotion dur="7.4s" begin="-2s" repeatCount="indefinite" path="M -30,880 C 410,690 610,650 830,520 C 1070,380 1210,180 1630,-30"/>
    </circle>
    <circle r="3">
      <animateMotion dur="6.7s" begin="-4s" repeatCount="indefinite" path="M -30,880 C 410,690 610,650 830,520 C 1070,380 1210,180 1630,-30"/>
    </circle>
  </g>

  <g fill="#7DE3D8" opacity=".8">
    <circle r="3">
      <animateMotion dur="8.3s" begin="-1s" repeatCount="indefinite" path="M 1630,-30 C 1210,180 1070,380 830,520 C 610,650 410,690 -30,880"/>
    </circle>
    <circle r="2.5">
      <animateMotion dur="6.9s" begin="-3.5s" repeatCount="indefinite" path="M 1630,-30 C 1210,180 1070,380 830,520 C 610,650 410,690 -30,880"/>
    </circle>
  </g>

  <g opacity=".24" stroke="#7F96AA" stroke-width="1">
    <path d="M140 80H1460M140 170H1460M140 260H1460M140 350H1460M140 440H1460M140 530H1460M140 620H1460M140 710H1460"/>
    <path d="M180 30V840M360 30V840M540 30V840M720 30V840M900 30V840M1080 30V840M1260 30V840M1440 30V840"/>
