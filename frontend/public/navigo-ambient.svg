  <path d="M-40 920 C 410 690 610 650 830 520 C 1070 380 1210 180 1640 -40"
        fill="none" stroke="#0A1118" stroke-width="128" stroke-linecap="round"/>

  <path d="M-50 920 C 410 690 610 650 830 520 C 1070 380 1210 180 1650 -40"
